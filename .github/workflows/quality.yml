name: Course page checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path
          pages=list(Path('.').rglob('index.html'))
          assert pages,'No lessons found'
          for p in pages:
              data=p.read_text(encoding='utf-8')
              assert '<html' in data.lower(),f'Invalid page: {p}'
              assert '</html>' in data.lower(),f'Unclosed page: {p}'
          print(f'Checked {len(pages)} course pages')
          PY
